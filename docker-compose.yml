version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: codev-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: codev
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: codev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongo-data:
